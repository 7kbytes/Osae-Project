<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Local Job Connector Admin</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--text:#1c2430;--muted:#6b7686;--line:#e3e8ef;--brand:#0f766e;--brand-d:#115e59;--danger:#dc2626;--warn:#d97706;--ok:#16a34a;--info:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#0f141a;--card:#182029;--text:#e6ebf1;--muted:#93a0b1;--line:#27313d;--brand:#14b8a6;--brand-d:#2dd4bf}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px;width:100%;max-width:360px}
.box h1{margin:0 0 4px;font-size:20px}.box p{margin:0 0 16px;color:var(--muted)}
input,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.box input{margin-bottom:10px}
.btn{padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer}
.btn:hover{border-color:var(--brand)}.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}.btn.p:hover{background:var(--brand-d)}
.btn.d{color:var(--danger)}.btn.d:hover{border-color:var(--danger)}.btn.s{padding:4px 9px;font-size:12px}
.err{color:var(--danger);margin:8px 0 0;min-height:18px}
#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
aside h2{font-size:15px;margin:0 8px 14px;color:var(--brand)}
nav button{display:block;width:100%;text-align:left;padding:9px 12px;margin-bottom:2px;border:0;background:none;border-radius:8px;cursor:pointer}
nav button:hover{background:var(--bg)}nav button.on{background:var(--brand);color:#fff}
.who{margin-top:auto;font-size:12px;color:var(--muted);padding:8px}
main{padding:22px;min-width:0}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.top h1{margin:0;font-size:20px;flex:1}
.top input,.top select{width:auto;min-width:150px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-size:26px}.stat span{color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.panel h3{margin:0 0 10px;font-size:14px}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px}.bar i{flex:0 0 100px;font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar div{height:10px;border-radius:5px;background:var(--brand);min-width:2px}.bar em{font-style:normal;color:var(--muted)}
.tw{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse}th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
td.w{white-space:normal;min-width:180px;max-width:320px}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;background:var(--card)}
tr:last-child td{border-bottom:0}tr.click{cursor:pointer}tr.click:hover{background:var(--bg)}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:var(--bg);border:1px solid var(--line)}
.t-resolved,.t-open,.t-accepted,.t-completed{color:var(--ok)}.t-dismissed{color:var(--muted)}.t-pending,.t-inProgress{color:var(--warn)}.t-rejected{color:var(--danger)}.t-admin{color:var(--info)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.msgs{max-height:60vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.msg{background:var(--bg);border-radius:8px;padding:7px 10px;display:flex;gap:8px;align-items:flex-start}.msg div{flex:1}.msg small{color:var(--muted)}
#modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:9}
#modal .box{max-width:640px}
#toast{position:fixed;bottom:18px;right:18px;background:var(--text);color:var(--bg);padding:10px 14px;border-radius:8px;z-index:10}
@media(max-width:760px){#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}nav{display:flex;flex-wrap:wrap}.who{margin:0 0 0 auto}}
</style>
</head>
<body>
<section id="login">
  <form class="box" id="lf">
    <h1>Admin sign in</h1><p>Local Job Connector</p>
    <input id="em" type="email" placeholder="Email" autocomplete="username" required>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn p" style="width:100%">Sign in</button>
    <div class="err" id="le"></div>
  </form>
</section>

<div id="app" class="hidden">
  <aside>
    <h2>LJC Admin</h2>
    <nav id="nav"></nav>
    <div class="who"><div id="me"></div><button class="btn s" id="out" style="margin-top:6px">Sign out</button></div>
  </aside>
  <main id="main"></main>
</div>
<div id="modal" class="hidden"><div class="box" id="mb"></div></div>
<div id="toast" class="hidden"></div>

<script type="module" src="admin.js"></script>
</body>
</html>
